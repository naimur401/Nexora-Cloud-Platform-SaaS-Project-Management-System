version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexora_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nexora-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: nexora_db
      JWT_SECRET: nexora_super_secret_key
      CLOUDINARY_CLOUD_NAME: guqaeax5
      CLOUDINARY_API_KEY: 473753228386636
      CLOUDINARY_API_SECRET: kLWLpaYpS6nmQAXDC7IFvlM-XMw
    depends_on:
      - postgres
    networks:
      - nexora-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - nexora-network

volumes:
  postgres_data:

networks:
  nexora-network:
    driver: bridge
